<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MyTerm SSH workspace showcase">
  <rect width="1200" height="520" rx="28" fill="#0f172a"/>
  <rect x="34" y="34" width="1132" height="452" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
  <rect x="34" y="34" width="1132" height="58" rx="22" fill="#1f2937"/>
  <circle cx="72" cy="63" r="8" fill="#ef4444"/>
  <circle cx="98" cy="63" r="8" fill="#f59e0b"/>
  <circle cx="124" cy="63" r="8" fill="#22c55e"/>
  <text x="160" y="69" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">MyTerm</text>
  <text x="260" y="69" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">SSH-first desktop operations workspace</text>

  <rect x="70" y="126" width="250" height="340" rx="18" fill="#0b1220" stroke="#334155"/>
  <text x="94" y="166" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Connections</text>
  <text x="94" y="196" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14">password / key / agent / jump</text>
  <rect x="94" y="226" width="202" height="54" rx="12" fill="#172554" stroke="#2563eb"/>
  <text x="114" y="259" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="16">prod-web-01</text>
  <rect x="94" y="296" width="202" height="54" rx="12" fill="#111827" stroke="#334155"/>
  <text x="114" y="329" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">staging-db</text>
  <rect x="94" y="366" width="202" height="54" rx="12" fill="#111827" stroke="#334155"/>
  <text x="114" y="399" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">edge-router</text>

  <rect x="356" y="126" width="488" height="340" rx="18" fill="#020617" stroke="#334155"/>
  <text x="386" y="166" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Terminal tabs</text>
  <rect x="386" y="194" width="176" height="34" rx="10" fill="#1d4ed8"/>
  <text x="408" y="216" fill="#eff6ff" font-family="Inter, Arial, sans-serif" font-size="14">prod-web-01</text>
  <rect x="574" y="194" width="132" height="34" rx="10" fill="#111827" stroke="#334155"/>
  <text x="594" y="216" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14">logs</text>
  <text x="386" y="270" fill="#22c55e" font-family="SFMono-Regular, Consolas, monospace" font-size="18">$ ssh prod-web-01</text>
  <text x="386" y="310" fill="#e5e7eb" font-family="SFMono-Regular, Consolas, monospace" font-size="18">MYTERM_SSH_OK</text>
  <text x="386" y="350" fill="#94a3b8" font-family="SFMono-Regular, Consolas, monospace" font-size="18">uname -a && pwd</text>
  <text x="386" y="390" fill="#38bdf8" font-family="SFMono-Regular, Consolas, monospace" font-size="18">/srv/apps/current</text>

  <rect x="880" y="126" width="250" height="102" rx="18" fill="#082f49" stroke="#0ea5e9"/>
  <text x="904" y="166" fill="#e0f2fe" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">SFTP</text>
  <text x="904" y="196" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="14">file operations in separate SSH sessions</text>

  <rect x="880" y="248" width="250" height="102" rx="18" fill="#052e16" stroke="#22c55e"/>
  <text x="904" y="288" fill="#dcfce7" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Monitoring</text>
  <text x="904" y="318" fill="#bbf7d0" font-family="Inter, Arial, sans-serif" font-size="14">CPU, memory, process and host checks</text>

  <rect x="880" y="370" width="250" height="96" rx="18" fill="#312e81" stroke="#818cf8"/>
  <text x="904" y="410" fill="#e0e7ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Proxy workflows</text>
  <text x="904" y="440" fill="#c7d2fe" font-family="Inter, Arial, sans-serif" font-size="14">HTTP CONNECT, SOCKS5, ProxyJump</text>
</svg>
