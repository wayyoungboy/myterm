[package]
name = "myterm-app"
version = "0.1.0"
description = "MyTerm - Modern Cross-Platform Terminal Manager"
authors = ["wayserver"]
edition = "2021"

[lib]
name = "myterm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SSH
ssh2 = "0.9"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rand = "0.8"
hex = "0.4"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
sha2 = "0.10"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
hostname = "0.4"
